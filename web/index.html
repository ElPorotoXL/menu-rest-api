<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #000;
            color: white;

        }
        article {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid white;
            padding: 10px;
            margin: 10px;
        }
    </style>
    <script type="module">
        fetch('https://menu-rest-api.onrender.com')
        .then(res => res.json())
        .then(menu => {
            const html = menu.map(item => {
                return `<article data-id="${item.id}">
                    <h2>${item.name}</h2>
                    <img src="https://menu-rest-api.onrender.com${item.image}" alt="${item.name}">
                    <p>${item.description}</p>
                    <p>${item.price}</p>
                    <button style="background-color: red; color: white;">DELETE</button>
                    </article>`
            }).join('')
            document.querySelector('main').innerHTML = html

            document.addEventListener('click', (e) => {
                if (e.target.matches('button')) {
                    const article = e.target.closest('article')
                    const id = article.dataset.id
                    fetch(`https://menu-rest-api.onrender.com/menu/${id}`, {
                        method: 'DELETE'
                    })
                    .then(res => {
                        if (res.ok) {
                            article.remove()
                        }
                    })
                }
            })
        })
    </script>
</head>
<body>
    <main></main>
</body>
</html>
